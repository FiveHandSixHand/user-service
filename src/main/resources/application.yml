spring:
  application:
    name: user-service # Config Server가 이 이름으로 설정 파일을 찾습니다.
  profiles:
    # 기본 프로파일을 local로 설정하여, 아무 설정 없이 실행하면 local이 활성화됩니다.
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

  config:
    import: "configserver:"